name: Sync Upstream

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'   # 每 6 小时一次，错峰避免整点拥堵
  workflow_dispatch:
    inputs:
      force_push:
        description: '创建空提交强制推送一次，用于验证部署密钥写权限（自检）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # 必须用读写部署密钥（SSH）：GITHUB_TOKEN 是 GitHub App 令牌，没有 workflows 权限，
          # 推送包含 .github/workflows/* 的上游提交会被拒绝：
          #   refusing to allow a GitHub App to create or update workflow ... without `workflows` permission
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main (no force push)
        env:
          FORCE_PUSH: ${{ inputs.force_push }}
        run: |
          git remote add upstream https://github.com/lbjxr/CF-Navs.git || git remote set-url upstream https://github.com/lbjxr/CF-Navs.git
          git fetch upstream --tags
          # 仅快进时直接快进；有分叉则合并，冲突以远端为准（fork 不应有本地改动）
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
          else
            if ! git merge upstream/main --no-edit -X theirs; then
              git merge --abort
              echo "::error::合并上游失败，已中止，未推送任何内容"
              exit 1
            fi
          fi
          if [ "$FORCE_PUSH" = "true" ]; then
            git commit --allow-empty -m "chore: sync self-check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          git push origin HEAD:main
