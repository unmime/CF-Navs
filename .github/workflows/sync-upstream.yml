name: Sync Upstream

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'   # 每 6 小时一次，错峰避免整点拥堵
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main (no force push)
        run: |
          git remote add upstream https://github.com/lbjxr/CF-Navs.git || git remote set-url upstream https://github.com/lbjxr/CF-Navs.git
          git fetch upstream --tags
          # 仅快进时直接快进；有分叉则合并，冲突以远端为准（fork 不应有本地改动）
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
          else
            git merge upstream/main --no-edit -X theirs || git merge upstream/main --abort
          fi
          git push origin main
